name: WebTorrent Windows 11 portable desktop build

on:
  push:
    branches:
      - feature/webtorrent-stage20-windows-portable
      - feature/webtorrent-stage21-windows-gui-crash-diagnostics
  workflow_dispatch:

jobs:
  portable-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare Windows dependencies
        uses: ./.github/actions/prepare-deps-win32
        with:
          arch: x64
          type: Deps
      - name: Setup Visual Studio environment
        uses: ./.github/actions/setup-vs-env-win32
        with:
          arch: x64
      - name: Configure WebTorrent + Qt desktop build
        shell: pwsh
        run: |
          $args = @(
            '-S .'
            '-B build-wt'
            '-G Ninja'
            '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
            ("-DCMAKE_PREFIX_PATH=" + $Env:DEPS_PREFIX)
            '-DENABLE_WEBTORRENT=ON'
            '-DENABLE_QT=ON'
            '-DENABLE_GTK=OFF'
            '-DENABLE_MAC=OFF'
            '-DENABLE_CLI=OFF'
            '-DENABLE_DAEMON=ON'
            '-DENABLE_UTILS=ON'
            '-DENABLE_TESTS=ON'
            '-DINSTALL_DOC=OFF'
            '-DREBUILD_WEB=OFF'
            '-DRUN_CLANG_TIDY=OFF'
            '-DUSE_SYSTEM_DEFAULT=OFF'
          )
          $vc = '"' + $Env:VCVARSALL + '"'
          cmd /c "$vc $Env:VC_ARCH >nul && cmake $($args -join ' ')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Qt desktop, daemon, remote and tests
        shell: pwsh
        run: |
          $vc = '"' + $Env:VCVARSALL + '"'
          cmd /c "$vc $Env:VC_ARCH >nul && cmake --build build-wt --parallel 3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run WebRTC regression tests
        shell: pwsh
        run: |
          ctest --test-dir build-wt -C RelWithDebInfo --output-on-failure -R 'LT\.(WebTorrent|PeerSocketRtc)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble portable Windows 11 package
        shell: pwsh
        run: |
          & tests/interoperability/package-windows-portable.ps1 -BuildDir build-wt -DepsPrefix "$env:DEPS_PREFIX" -OutputDir "$env:RUNNER_TEMP/Transmission-WebTorrent-Windows-x64"
      - name: Smoke-test installed executables
        shell: pwsh
        run: |
          $bin = "$env:RUNNER_TEMP/Transmission-WebTorrent-Windows-x64/bin"
          & "$bin/transmission-daemon.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Daemon failed smoke test' }
          & "$bin/transmission-remote.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Remote failed smoke test' }
          & "$bin/transmission-qt.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Qt desktop failed smoke test' }
      - name: Smoke-test normal Qt GUI initialization with clean profile
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:RUNNER_TEMP 'Transmission-WebTorrent-Windows-x64/bin'
          $exe = Join-Path $bin 'transmission-qt.exe'
          $profile = Join-Path $env:RUNNER_TEMP 'qt-gui-smoke-profile'
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          # Capture the crash from the clean-profile GUI startup.
          $dumpDir = Join-Path $env:RUNNER_TEMP 'qt-gui-dumps'
          New-Item -ItemType Directory -Path $dumpDir -Force | Out-Null
          $werKey = 'HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\transmission-qt.exe'
          New-Item -Path $werKey -Force | Out-Null
          New-ItemProperty -Path $werKey -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $werKey -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
          New-ItemProperty -Path $werKey -Name DumpCount -PropertyType DWord -Value 2 -Force | Out-Null
          $process = Start-Process -FilePath $exe -ArgumentList @('--config-dir', ('"' + $profile + '"')) -WorkingDirectory $bin -PassThru
          try {
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) {
              $ntstatus = [long]$process.ExitCode -band 4294967295
              throw ("Qt GUI exited during startup (ExitCode={0}, NTSTATUS=0x{1:X8})" -f $process.ExitCode, $ntstatus)
            }
            Write-Host "Qt GUI remains running 15s after normal startup (PID=$($process.Id))"
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Upload matching Windows Qt debug symbols
        if: always()
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'Transmission-Qt-PDB'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $symbols = @(Get-ChildItem -Path 'build-wt' -Recurse -File -Filter 'transmission-qt.pdb' -ErrorAction SilentlyContinue)
          Write-Host "Matching transmission-qt.pdb files found: $($symbols.Count)"
          foreach ($symbol in $symbols) { Copy-Item $symbol.FullName -Destination $dest -Force }
          if ($symbols.Count -eq 0) { Write-Warning 'No Qt debug symbols available from this build' }
      - name: Publish Windows Qt debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Transmission-WebTorrent-Windows-x64-symbols
          path: ${{ runner.temp }}/Transmission-Qt-PDB/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Windows Qt crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Transmission-WebTorrent-Windows-x64-crash-dumps
          path: ${{ runner.temp }}/qt-gui-dumps/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload portable Windows 11 build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Transmission-WebTorrent-Windows-x64
          path: ${{ runner.temp }}/Transmission-WebTorrent-Windows-x64/**
          if-no-files-found: error
          retention-days: 30
