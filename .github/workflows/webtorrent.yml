name: WebTorrent feature (Linux, macOS, Windows, interop)

on:
  push:
    branches:
      - 'feature/webtorrent-*'
      - 'diagnostics/webtorrent-rtc-signaling'
  pull_request:
    paths:
      - 'libtransmission/peer-socket-rtc.*'
      - 'libtransmission/announcer-ws.*'
      - 'libtransmission/webtorrent-*.cc'
      - 'libtransmission/webtorrent-*.h'
      - '.github/workflows/webtorrent.yml'
  workflow_dispatch:

jobs:
  webrtc:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/install-deps
        with:
          compiler: clang
          use-sudo: true
      - name: Configure WebRTC build
        run: |
          cmake -S . -B build-wt -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_WEBTORRENT=ON -DENABLE_TESTS=ON \
            -DENABLE_GTK=OFF -DENABLE_QT=OFF -DENABLE_MAC=OFF \
            -DENABLE_CLI=OFF -DENABLE_DAEMON=ON \
            -DREBUILD_WEB=OFF -DRUN_CLANG_TIDY=OFF \
            -DUSE_SYSTEM_DEFAULT=ON \
            -DUSE_SYSTEM_DHT=OFF -DUSE_SYSTEM_SIGSLOT=OFF \
            -DUSE_SYSTEM_SMALL=OFF -DUSE_SYSTEM_UTP=OFF \
            -DUSE_SYSTEM_WIDE_INTEGER=OFF
      - name: Build tests and daemon
        run: cmake --build build-wt --target libtransmission-test transmission-daemon -j 3
      - name: Run libtransmission tests
        run: ctest --test-dir build-wt --output-on-failure -R 'LT\.'


      - name: Checkout pinned anacrolix client (Pion WebRTC)
        uses: actions/checkout@v4
        with:
          repository: jasminsehic/torrent
          ref: 40144f54349deb3b3a67e74764f1d36eeefc899d
          path: anacrolix-src
          persist-credentials: false
      - name: Set up Go for anacrolix client
        uses: actions/setup-go@v5
        with:
          go-version-file: anacrolix-src/go.mod
          cache-dependency-path: anacrolix-src/go.sum
      - name: Build independent anacrolix/Pion peer
        run: |
          cd anacrolix-src
          GOWORK=off go build -o "$GITHUB_WORKSPACE/anacrolix-interop-peer" \
            "$GITHUB_WORKSPACE/tests/interoperability/anacrolix-peer.go"
      - name: Run bidirectional WebTorrent interoperability tests
        timeout-minutes: 12
        run: |
          python3 tests/interoperability/run-anacrolix-interop.py \
            --daemon build-wt/daemon/transmission-daemon \
            --peer ./anacrolix-interop-peer \
            --workdir "$RUNNER_TEMP/webtorrent-interop"
      - name: Upload interoperability logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webtorrent-anacrolix-interop-logs
          path: ${{ runner.temp }}/webtorrent-interop/**
          if-no-files-found: ignore

  webrtc-windows:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'feature/webtorrent-stage19-') }}
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare Windows dependencies
        uses: ./.github/actions/prepare-deps-win32
        with:
          arch: x64
          type: Deps
      - name: Setup Visual Studio environment
        uses: ./.github/actions/setup-vs-env-win32
        with:
          arch: x64
      - name: Configure WebRTC build
        shell: pwsh
        run: |
          $CmakeArgs = @(
            '-S .'
            '-B build-wt'
            '-G Ninja'
            '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
            "-DCMAKE_PREFIX_PATH=`"$Env:DEPS_PREFIX`""
            '-DENABLE_WEBTORRENT=ON'
            '-DENABLE_TESTS=ON'
            '-DENABLE_GTK=OFF'
            '-DENABLE_QT=OFF'
            '-DENABLE_MAC=OFF'
            '-DENABLE_CLI=OFF'
            '-DENABLE_DAEMON=ON'
            '-DREBUILD_WEB=OFF'
            '-DRUN_CLANG_TIDY=OFF'
            '-DUSE_SYSTEM_DEFAULT=OFF'
          )
          cmd /c "`"$Env:VCVARSALL`" $Env:VC_ARCH >nul && cmake $($CmakeArgs -join ' ')"
      - name: Build tests and daemon
        shell: pwsh
        run: |
          cmd /c "`"$Env:VCVARSALL`" $Env:VC_ARCH >nul && cmake --build build-wt --config RelWithDebInfo --target libtransmission-test transmission-daemon --parallel 3"
      - name: Run WebRTC integration tests
        shell: pwsh
        run: ctest --test-dir build-wt -C RelWithDebInfo --output-on-failure -R 'LT\.(WebTorrent|PeerSocketRtc)'

  webrtc-macos:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'feature/webtorrent-stage19-') }}
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/install-deps
        with:
          compiler: system-default
      - name: Configure WebRTC build
        run: |
          cmake -S . -B build-wt -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DENABLE_WEBTORRENT=ON -DENABLE_TESTS=ON \
            -DENABLE_GTK=OFF -DENABLE_QT=OFF -DENABLE_MAC=OFF \
            -DENABLE_CLI=OFF -DENABLE_DAEMON=ON \
            -DREBUILD_WEB=OFF -DRUN_CLANG_TIDY=OFF \
            -DUSE_SYSTEM_DEFAULT=ON \
            -DUSE_SYSTEM_DHT=OFF -DUSE_SYSTEM_SIGSLOT=OFF \
            -DUSE_SYSTEM_SMALL=OFF -DUSE_SYSTEM_UTP=OFF \
            -DUSE_SYSTEM_WIDE_INTEGER=OFF
      - name: Build tests and daemon
        run: cmake --build build-wt --target libtransmission-test transmission-daemon -j 3
      - name: Run WebRTC integration tests
        run: ctest --test-dir build-wt --output-on-failure -R 'LT\.(WebTorrent|PeerSocketRtc)'
